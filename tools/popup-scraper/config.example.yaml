# popups.fyi scraper configuration  (copy this file to `config.yaml`)
# ---------------------------------------------------------------------------
# `python scrape.py` reads `config.yaml` by default. Edit freely — everything
# except a couple of defaults is optional. Comments explain each section.

city: Seattle
timezone: America/Los_Angeles

geocode:
  enabled: true
  # Nominatim (OpenStreetMap) asks that automated users identify themselves.
  # Put a real email here so lookups aren't rate-limited/blocked.
  user_agent_email: you@example.com

# ---------------------------------------------------------------------------
# VENUES that frequently host pop-ups.
# Listing a venue here means any event at it is auto-filled with exact
# coordinates + neighborhood — you never have to look those up again. The
# scraper matches venue names fuzzily (e.g. "... at Parlour" -> Parlour).
# (Seeded from your existing sheet; add/adjust as you learn new spots.)
# ---------------------------------------------------------------------------
venues:
  - name: Parlour
    address: "Pioneer Square, Seattle, WA"
    neighborhood: Pioneer Square
    lat: 47.6017
    lng: -122.3327
  - name: Nakagawa Japanese Restaurant
    address: "Bothell, WA"
    neighborhood: Bothell
    city: Bothell
    lat: 47.7623
    lng: -122.2054
  - name: Hiroshi's Take Out & Deli
    aliases: ["Hiroshi's"]
    address: "Beacon Hill, Seattle, WA"
    neighborhood: Beacon Hill
    lat: 47.5790
    lng: -122.3110
  - name: Armadillo Bakehouse
    address: "4611 36th Ave SW, Seattle, WA"
    neighborhood: West Seattle
    lat: 47.5586
    lng: -122.3833
  - name: Miero Coffee Bar
    address: "Chinatown-ID, Seattle, WA"
    neighborhood: Chinatown-ID
    lat: 47.5980
    lng: -122.3240
  - name: Volunteer Park Cafe & Pantry
    aliases: ["Volunteer Park Cafe"]
    address: "1501 17th Ave E, Seattle, WA"
    neighborhood: Capitol Hill
    lat: 47.6320
    lng: -122.3115
  # A few real Seattle markets that regularly host food vendors (verify/adjust
  # coordinates as you like — these are approximate).
  - name: Fremont Sunday Market
    address: "N 34th St & Phinney Ave N, Seattle, WA"
    neighborhood: Fremont
    lat: 47.6510
    lng: -122.3486
  - name: Ballard Farmers Market
    address: "Ballard Ave NW, Seattle, WA"
    neighborhood: Ballard
    lat: 47.6685
