name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The pages are prerendered from the sheet at build time, so rebuild every
  # hour to follow it (a little after the hour; GitHub starts scheduled runs
  # late when it's busy). GitHub turns schedules off in public repos after 60
  # days without activity in the repository - re-enable it from the Actions
  # tab if that happens.
  schedule:
    - cron: '17 * * * *'
  # A rebuild on request, e.g. from the sheet right after an edit (README,
  # "Prerendering").
  repository_dispatch:
    types: [sheet-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds the app, then prerenders every page from the live sheets. Fails
      # (and so keeps the last good deploy live) if the sheet can't be read.
      - name: Build
        env:
          VITE_SHEET_CSV_URL: ${{ secrets.VITE_SHEET_CSV_URL }}
          VITE_RESIDENCY_CSV_URL: ${{ secrets.VITE_RESIDENCY_CSV_URL }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
        run: npm run build

      # Status codes, titles, canonicals, structured data and the sitemap, as a
      # crawler without JavaScript sees them. A failure stops the deploy.
      - name: Check pages
        run: npm run seo:check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
